<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local portrait sampling</title>
<pre id="result"></pre>
<script>
  const photo = new Image();
  photo.onload = () => {
    const width = photo.naturalWidth;
    const height = photo.naturalHeight;
    const source = document.createElement('canvas');
    source.width = width;
    source.height = height;
    const context = source.getContext('2d', { willReadFrequently: true });
    context.drawImage(photo, 0, 0);
    const image = context.getImageData(0, 0, width, height);
    const pixels = image.data;
    const luminance = offset =>
      .2126 * pixels[offset] + .7152 * pixels[offset + 1] + .0722 * pixels[offset + 2];

    // The supplied portrait has a white background. Find its largest nonwhite
    // connected subject, without facial landmarks or photo-specific polygons.
    const labels = new Int32Array(width * height);
    const queue = new Int32Array(labels.length);
    let component = 0;
    let largest = 0;
    let largestSize = 0;
    const isSubject = index => pixels[index * 4 + 3] > 0 && luminance(index * 4) < 240;
    const neighbors = (index, visit) => {
      const x = index % width;
      if (x > 0) visit(index - 1);
      if (x < width - 1) visit(index + 1);
      if (index >= width) visit(index - width);
      if (index < labels.length - width) visit(index + width);
    };
    for (let seed = 0; seed < labels.length; seed++) {
      if (labels[seed] || !isSubject(seed)) continue;
      component++;
      let head = 0;
      let tail = 0;
      const visit = index => {
        if (labels[index] || !isSubject(index)) return;
        labels[index] = component;
        queue[tail++] = index;
      };
      visit(seed);
      while (head < tail) neighbors(queue[head++], visit);
      if (tail > largestSize) {
        largestSize = tail;
        largest = component;
      }
    }
    if (!largestSize) throw new Error('No subject found against the white background.');

    // Flood only the exterior of that silhouette. Enclosed highlights retain
    // their original pixels, so bright skin cannot turn into empty characters.
    const outside = new Uint8Array(labels.length);
    let head = 0;
    let tail = 0;
    const visitOutside = index => {
      if (outside[index] || labels[index] === largest) return;
      outside[index] = 1;
      queue[tail++] = index;
    };
    for (let x = 0; x < width; x++) {
      visitOutside(x);
      visitOutside((height - 1) * width + x);
    }
    for (let y = 0; y < height; y++) {
      visitOutside(y * width);
      visitOutside(y * width + width - 1);
    }
    while (head < tail) neighbors(queue[head++], visitOutside);

    let left = width, right = 0, top = height, bottom = 0;
    for (let index = 0; index < outside.length; index++) {
      if (outside[index]) {
        pixels[index * 4 + 3] = 0;
        continue;
      }
      const x = index % width, y = Math.floor(index / width);
      left = Math.min(left, x);
      right = Math.max(right, x);
      top = Math.min(top, y);
      bottom = Math.max(bottom, y);
    }
    const padding = Math.round((right - left + 1) * .04);
    left = Math.max(0, left - padding);
    right = Math.min(width - 1, right + padding);
    top = Math.max(0, top - padding);
    bottom = Math.min(height - 1, bottom + padding);
    const crop = { x: left, y: top, width: right - left + 1, height: bottom - top + 1 };
    context.putImageData(image, 0, 0);

    const font = { family: 'Liberation Mono, monospace', weight: 700, cellAspect: .6 };
    const columns = 160;
    const rows = Math.round(columns * crop.height / crop.width * font.cellAspect);
    const sample = document.createElement('canvas');
    sample.width = columns;
    sample.height = rows;
    const sampleContext = sample.getContext('2d', { willReadFrequently: true });
    sampleContext.imageSmoothingQuality = 'high';
    sampleContext.drawImage(source, crop.x, crop.y, crop.width, crop.height, 0, 0, columns, rows);
    const sampled = sampleContext.getImageData(0, 0, columns, rows).data;
    const tones = Array.from({ length: rows }, (_, y) =>
      Array.from({ length: columns }, (_, x) => {
        const offset = (y * columns + x) * 4;
        return sampled[offset + 3] < 100 ? null : Math.round(
          .2126 * sampled[offset] + .7152 * sampled[offset + 1] + .0722 * sampled[offset + 2]);
      }));

    // Measure actual glyph coverage: alphabetic order is not brightness order.
    // The renderer combines this coverage with ink intensity to keep smooth tones.
    const calibration = document.createElement('canvas');
    calibration.width = 60;
    calibration.height = 100;
    const ink = calibration.getContext('2d', { willReadFrequently: true });
    ink.font = `${font.weight} 100px ${font.family}`;
    ink.fillStyle = '#fff';
    const glyphs = [...'.,:;i1tfLCG08@'].map(char => {
      ink.clearRect(0, 0, 60, 100);
      ink.fillText(char, 0, 80);
      const data = ink.getImageData(0, 0, 60, 100).data;
      let coverage = 0;
      for (let offset = 3; offset < data.length; offset += 4) coverage += data[offset] / 255;
      return { char, coverage: Number((coverage / 6000).toFixed(8)) };
    }).sort((a, b) => a.coverage - b.coverage);

    document.getElementById('result').textContent = JSON.stringify({
      version: 2, columns, rows, source: { width, height, crop }, font, glyphs, tones,
    });
  };
  photo.src = '__PHOTO_DATA_URL__';
</script>
</html>
